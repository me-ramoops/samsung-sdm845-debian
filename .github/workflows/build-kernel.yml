name: Build Kernel 7.1 with BCM4361 Wi-Fi

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'configs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq bc bison ca-certificates ccache clang cpio device-tree-compiler \
            flex gcc-aarch64-linux-gnu git gzip kmod libelf-dev libssl-dev llvm lld make python3 u-boot-tools zstd

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-kernel-7.1-${{ github.run_id }}
          restore-keys: ccache-kernel-7.1-

      - name: Setup SSH for GitLab
        env:
          GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$GITLAB_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts

      - name: Clone SDM845 7.1 Kernel Source
        run: |
          git clone --depth 1 --branch sdm845/7.1-dev git@gitlab.com:vanadium-oss/samsung-sdm845/Mainline/linux.git linux
          cd linux
          echo "Commit: $(git rev-parse HEAD)"

      - name: Build Kernel Image and DTBs
        run: |
          export CC="ccache clang"
          cd linux
          touch .scmversion

          cp "$GITHUB_WORKSPACE/configs/s9-pmos-wifi.config" .config
          make ARCH=arm64 LLVM=1 olddefconfig
          make ARCH=arm64 LLVM=1 -j"$(nproc)" Image dtbs

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp arch/arm64/boot/Image "$GITHUB_WORKSPACE/output/Image"
          cp arch/arm64/boot/dts/qcom/sdm845-samsung-starqltechn.dtb "$GITHUB_WORKSPACE/output/"
          cp arch/arm64/boot/dts/qcom/sdm845-samsung-star2qltechn.dtb "$GITHUB_WORKSPACE/output/"
          cp arch/arm64/boot/dts/qcom/sdm845-samsung-crownqltechn.dtb "$GITHUB_WORKSPACE/output/"

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdm845-7.1-kernel-wifi
          path: output/
          retention-days: 14
